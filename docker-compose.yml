services:
  backend:
    image: ${REGISTRY:-local}/backend:${IMAGE_TAG:-dev}
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  web:
    image: ${REGISTRY:-local}/web:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
