services:
  backend:
    image: ${REGISTRY:-local}/backend:${IMAGE_TAG:-dev}
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Built from the one secret the db container also reads. Fail closed: without it the
      # backend would fall back to memory and lose every order.
      SKIP_DATABASE_MIGRATIONS: ${SKIP_DATABASE_MIGRATIONS:-false}
      DATABASE_URL: postgresql+psycopg://valtuus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/valtuus
    volumes:
      # Keeps the last good catalog across deploys, so startup can fall back to it when the
      # upstream download fails.
      - catalog_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: valtuus
      POSTGRES_DB: valtuus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # No ports: only the backend on the compose network reaches the database.
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "valtuus", "-d", "valtuus"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    image: ${REGISTRY:-local}/web:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  catalog_data:
  pg_data:
  caddy_data:
  caddy_config:
