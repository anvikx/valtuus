name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  # Cancel stale PR runs only. A main run that is cut short could skip a deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Same image as docker-compose.yml. A throwaway database, so the password is no secret.
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: valtuus
          POSTGRES_PASSWORD: test
          POSTGRES_DB: valtuus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valtuus -d valtuus_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
        env:
          # Without it the Postgres tests skip, so CI must always set it.
          TEST_DATABASE_URL: postgresql+psycopg://valtuus:test@localhost:5432/valtuus_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    env:
      # Same image as `make check-infra`. actionlint 1.7.12, ships shellcheck.
      LINT_IMAGE: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/repo" -w /repo "$LINT_IMAGE"
      - run: docker run --rm -v "$PWD:/repo" -w /repo --entrypoint shellcheck "$LINT_IMAGE" scripts/deploy.sh

  images:
    if: github.ref == 'refs/heads/main'
    needs: [backend, frontend, infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      registry: ${{ steps.registry.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects upper case, and the owner name may contain it.
      - id: registry
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.registry.outputs.name }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.registry.outputs.name }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    if: vars.DEPLOY_FROZEN != 'true'
    needs: images
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      # Never stop a deploy half way. The next one waits its turn.
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # A rerun of an old run, or a run that waited behind a newer push, must not put an
      # older commit on production. Only the head of main deploys.
      - id: head
        # Adds pipefail, so a failed lookup fails the job instead of a silent skip.
        shell: bash
        run: |
          head_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "${head_sha}" == "${GITHUB_SHA}" ]]; then
            echo "is_head=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "is_head=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skip deploy: ${GITHUB_SHA} is not the head of main (${head_sha})."

      - if: steps.head.outputs.is_head == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.yml,scripts/deploy.sh
          target: ${{ secrets.DEPLOY_PATH }}

      - if: steps.head.outputs.is_head == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REGISTRY: ${{ needs.images.outputs.registry }}
          TAG: ${{ github.sha }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,REGISTRY,TAG,DEPLOY_PATH
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd "$DEPLOY_PATH"
            REGISTRY="$REGISTRY" bash scripts/deploy.sh "$TAG"
